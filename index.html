<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Study Tracker</h1>
        <p>Plan smart. Study consistently.</p>
    </header>

    <main>
        <section class="dashboard">
            <div class="stat">
                <h3>Total Tasks</h3>
                <p id="total">0</p>
            </div>
            <div class="stat">
                <h3>Completed</h3>
                <p id="completed">0</p>
            </div>
            <div class="stat">
                <h3>Pending</h3>
                <p id="pending">0</p>
            </div>
            <div class="stat">
                <h3>Progress</h3>
                <p id="progress">0%</p>
            </div>
        </section>

        <section class="panel">
            <h2>Add Study Task</h2>

            <form id="taskForm">
                <label>Category</label>
                <select id="category">
                    <option>School</option>
                    <option>JEE</option>
                    <option>Programming</option>
                    <option>Personal</option>
                </select>

                <label>Subject / Language</label>
                <input id="subject" list="subjects" placeholder="e.g. Physics, Python" required>

                <datalist id="subjects">
                    <option value="Maths">
                    <option value="Physics">
                    <option value="Chemistry">
                    <option value="Biology">
                    <option value="Python">
                    <option value="HTML">
                    <option value="CSS">
                    <option value="JavaScript">
                    <option value="React">
                    <option value="C">
                    <option value="C++">
                    <option value="Java">
                    <option value="SQL">
                    <option value="Other">
                </datalist>

                <label>Topic</label>
                <input id="topic" placeholder="Enter topic" required>

                <div class="two-columns">
                    <div>
                        <label>Study Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <div>
                        <label>Start Time</label>
                        <input type="time" id="time">
                    </div>
                </div>

                <label>Planned Minutes</label>
                <input type="number" id="planned" min="1" placeholder="e.g. 60" required>

                <label>Study Technique</label>
                <select id="technique">
                    <option>Active Recall</option>
                    <option>Spaced Repetition (1-4-7)</option>
                    <option>Question Practice</option>
                    <option>Feynman Technique</option>
                    <option>Pomodoro</option>
                    <option>Concept Learning</option>
                    <option>Revision</option>
                </select>

                <button type="submit">+ Add Task</button>
            </form>
        </section>

        <section class="panel">
            <h2>All Study Tasks</h2>
            <div id="taskList"></div>
        </section>

        <section class="panel">
            <h2>Pending Tasks</h2>
            <div id="pendingList"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
